<svg width="100%" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#18234a"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#6366f1"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<circle cx="180" cy="80" r="120" fill="#22d3ee" opacity=".10" filter="url(#soft)">
  <animate attributeName="cx" values="180;240;180" dur="12s" repeatCount="indefinite"/>
</circle>
<circle cx="1000" cy="290" r="130" fill="#8b5cf6" opacity=".10" filter="url(#soft)">
  <animate attributeName="cy" values="290;240;290" dur="14s" repeatCount="indefinite"/>
</circle>

<rect x="55" y="45" width="1090" height="270" rx="24" fill="#091525" opacity=".94" stroke="#22d3ee" stroke-opacity=".55"/>
<circle cx="82" cy="73" r="7" fill="#ff5f56"/><circle cx="105" cy="73" r="7" fill="#ffbd2e"/><circle cx="128" cy="73" r="7" fill="#27c93f"/>
<text x="160" y="79" fill="#9cc8e8" font-family="monospace" font-size="18">govind@devops: ~/projects</text>
<g font-family="monospace" font-size="21">
<text x="85" y="125" fill="#22d3ee">$ whoami</text>
<text x="245" y="125" fill="#eaf6ff">Govind Sai Krishna Rayarao</text>
<text x="85" y="163" fill="#22d3ee">$ terraform plan</text>
<text x="290" y="163" fill="#eaf6ff">Infrastructure changes detected...</text>
<text x="85" y="201" fill="#22d3ee">$ docker ps</text>
<text x="250" y="201" fill="#eaf6ff">Containers: RUNNING</text>
<text x="85" y="239" fill="#22d3ee">$ kubectl get pods</text>
<text x="300" y="239" fill="#34d399">3/3 Running</text>
<text x="85" y="277" fill="#22d3ee">$ _</text>
</g>
<rect x="105" y="284" width="12" height="22" fill="#22d3ee"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>

</svg>