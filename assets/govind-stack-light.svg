<svg width="100%" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#eaf4ff"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#6366f1"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<circle cx="180" cy="80" r="120" fill="#22d3ee" opacity=".10" filter="url(#soft)">
  <animate attributeName="cx" values="180;240;180" dur="12s" repeatCount="indefinite"/>
</circle>
<circle cx="1000" cy="290" r="130" fill="#8b5cf6" opacity=".10" filter="url(#soft)">
  <animate attributeName="cy" values="290;240;290" dur="14s" repeatCount="indefinite"/>
</circle>

<rect x="55" y="30" width="1090" height="300" rx="28" fill="#ffffff" opacity=".96" stroke="#1677c8" stroke-opacity=".35"/>
<text x="600" y="68" text-anchor="middle" fill="#10233d" font-family="sans-serif" font-size="25" font-weight="700">GOVIND • DEVOPS TECHNOLOGY ORBIT</text>
<g transform="translate(600 190)">
 <ellipse rx="270" ry="95" fill="none" stroke="#22d3ee" stroke-opacity=".45" stroke-width="3">
   <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
 </ellipse>
 <ellipse rx="205" ry="72" fill="none" stroke="#8b5cf6" stroke-opacity=".45" stroke-width="3">
   <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/>
 </ellipse>
 <ellipse rx="140" ry="48" fill="none" stroke="#34d399" stroke-opacity=".45" stroke-width="3">
   <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
 </ellipse>
 <circle r="62" fill="#102a5b" stroke="#22d3ee" stroke-width="3" filter="url(#glow)"/>
 <text y="7" text-anchor="middle" fill="#10233d" font-family="sans-serif" font-size="20" font-weight="800">GOVIND</text>
 <text y="29" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="12">DEVOPS</text>
 <g font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">
   <g transform="translate(270 0)"><circle r="31" fill="#172554" stroke="#ff9900"/><text y="5" fill="#10233d">AWS</text></g>
   <g transform="translate(-270 0)"><circle r="31" fill="#172554" stroke="#f05032"/><text y="5" fill="#10233d">Git</text></g>
   <g transform="translate(0 -95)"><circle r="31" fill="#172554" stroke="#844fba"/><text y="5" fill="#10233d">TF</text></g>
   <g transform="translate(0 95)"><circle r="31" fill="#172554" stroke="#2496ed"/><text y="5" fill="#10233d">Docker</text></g>
   <g transform="translate(205 -72)"><circle r="31" fill="#172554" stroke="#326ce5"/><text y="5" fill="#10233d">K8s</text></g>
   <g transform="translate(-205 72)"><circle r="31" fill="#172554" stroke="#d24939"/><text y="5" fill="#10233d">Jenkins</text></g>
 </g>
</g>

</svg>