<svg width="100%" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#eaf4ff"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#6366f1"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<circle cx="180" cy="80" r="120" fill="#22d3ee" opacity=".10" filter="url(#soft)">
  <animate attributeName="cx" values="180;240;180" dur="12s" repeatCount="indefinite"/>
</circle>
<circle cx="1000" cy="290" r="130" fill="#8b5cf6" opacity=".10" filter="url(#soft)">
  <animate attributeName="cy" values="290;240;290" dur="14s" repeatCount="indefinite"/>
</circle>

<rect x="55" y="55" width="1090" height="250" rx="26" fill="#ffffff" opacity=".95" stroke="#22d3ee" stroke-opacity=".5"/>
<text x="600" y="92" text-anchor="middle" fill="#10233d" font-family="sans-serif" font-size="26" font-weight="700">CONTAINERS → KUBERNETES</text>
<g font-family="sans-serif" text-anchor="middle">
 <rect x="100" y="135" width="190" height="90" rx="20" fill="#0b3554" stroke="#22d3ee"/>
 <text x="195" y="173" fill="#10233d" font-size="24" font-weight="700">Docker</text>
 <text x="195" y="200" fill="#10233d" font-size="15">image + container</text>
 <path d="M300 180 H440" stroke="url(#accent)" stroke-width="6"/>
 <circle r="8" fill="#22d3ee"><animateMotion dur="1.8s" repeatCount="indefinite" path="M305 180 H435"/></circle>
 <rect x="450" y="110" width="280" height="140" rx="24" fill="#102a5b" stroke="#6366f1"/>
 <text x="590" y="150" fill="#10233d" font-size="25" font-weight="700">Kubernetes</text>
 <circle cx="515" cy="205" r="25" fill="#172554" stroke="#22d3ee"/>
 <circle cx="590" cy="205" r="25" fill="#172554" stroke="#22d3ee"/>
 <circle cx="665" cy="205" r="25" fill="#172554" stroke="#22d3ee"/>
 <text x="515" y="211" fill="#10233d" font-size="12">POD</text><text x="590" y="211" fill="#10233d" font-size="12">POD</text><text x="665" y="211" fill="#10233d" font-size="12">POD</text>
 <path d="M740 180 H850" stroke="url(#accent)" stroke-width="6"/>
 <circle r="8" fill="#a78bfa"><animateMotion dur="1.8s" repeatCount="indefinite" path="M745 180 H845"/></circle>
 <rect x="860" y="135" width="220" height="90" rx="20" fill="#12315a" stroke="#34d399"/>
 <text x="970" y="173" fill="#10233d" font-size="24" font-weight="700">Service</text>
 <text x="970" y="200" fill="#10233d" font-size="15">stable access</text>
</g>

</svg>