<svg width="100%" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#eaf4ff"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#6366f1"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<circle cx="180" cy="80" r="120" fill="#22d3ee" opacity=".10" filter="url(#soft)">
  <animate attributeName="cx" values="180;240;180" dur="12s" repeatCount="indefinite"/>
</circle>
<circle cx="1000" cy="290" r="130" fill="#8b5cf6" opacity=".10" filter="url(#soft)">
  <animate attributeName="cy" values="290;240;290" dur="14s" repeatCount="indefinite"/>
</circle>
<rect x="55" y="55" width="1090" height="250" rx="26" fill="#ffffff" opacity=".95" stroke="#6366f1" stroke-opacity=".45"/>
<text x="600" y="92" text-anchor="middle" fill="#10233d" font-family="sans-serif" font-weight="700" font-size="26">CI/CD AUTOMATION PIPELINE</text>
<circle cx="120" cy="160" r="46" fill="#0b2140" stroke="#22d3ee" stroke-width="3" filter="url(#glow)"/>
<text x="120" y="166" text-anchor="middle" fill="#10233d" font-family="sans-serif" font-size="16" font-weight="700">GitHub</text>
<circle cx="390" cy="160" r="46" fill="#0b2140" stroke="#22d3ee" stroke-width="3" filter="url(#glow)"/>
<text x="390" y="166" text-anchor="middle" fill="#10233d" font-family="sans-serif" font-size="16" font-weight="700">Jenkins</text>
<circle cx="660" cy="160" r="46" fill="#0b2140" stroke="#22d3ee" stroke-width="3" filter="url(#glow)"/>
<text x="660" y="166" text-anchor="middle" fill="#10233d" font-family="sans-serif" font-size="16" font-weight="700">Docker</text>
<circle cx="930" cy="160" r="46" fill="#0b2140" stroke="#22d3ee" stroke-width="3" filter="url(#glow)"/>
<text x="930" y="166" text-anchor="middle" fill="#10233d" font-family="sans-serif" font-size="16" font-weight="700">AWS</text>
<path d="M166 160 H344" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
<circle r="7" fill="#22d3ee"><animateMotion dur="2.4s" repeatCount="indefinite" path="M166 160 H344"/></circle>
<path d="M436 160 H614" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
<circle r="7" fill="#22d3ee"><animateMotion dur="2.4s" repeatCount="indefinite" path="M436 160 H614"/></circle>
<path d="M706 160 H884" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
<circle r="7" fill="#22d3ee"><animateMotion dur="2.4s" repeatCount="indefinite" path="M706 160 H884"/></circle>
<text x="390" y="245" text-anchor="middle" fill="#10233d" font-family="sans-serif" font-size="18">BUILD</text>
<circle cx="390" cy="220" r="9" fill="#34d399"><animate attributeName="r" values="7;11;7" dur="1.6s" repeatCount="indefinite"/></circle>
<text x="660" y="245" text-anchor="middle" fill="#10233d" font-family="sans-serif" font-size="18">TEST</text>
<circle cx="660" cy="220" r="9" fill="#34d399"><animate attributeName="r" values="7;11;7" dur="1.6s" repeatCount="indefinite"/></circle>
<text x="930" y="245" text-anchor="middle" fill="#10233d" font-family="sans-serif" font-size="18">DEPLOY</text>
<circle cx="930" cy="220" r="9" fill="#34d399"><animate attributeName="r" values="7;11;7" dur="1.6s" repeatCount="indefinite"/></circle>
</svg>